<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b18; font-family: 'Space Grotesk', sans-serif; }
  #scene { position: absolute; inset: 0; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
             justify-content: space-between; padding: 34px 16px 22px; pointer-events: none; text-align: center; }
  .eyebrow { color: #7dd3fc; letter-spacing: .35em; font-size: 12px; text-transform: uppercase; opacity: 0;
             animation: fadeIn 1s .2s forwards; }
  h1 { font-family: 'Orbitron', sans-serif; font-weight: 800; margin: 10px 0 6px; font-size: clamp(30px, 5.4vw, 64px);
       letter-spacing: .06em; color: #fff; text-shadow: 0 0 18px rgba(125,211,252,.55), 0 0 42px rgba(192,132,252,.35);
       opacity: 0; animation: fadeIn 1.2s .4s forwards, glow 4s ease-in-out infinite; }
  .sub { color: #c7d2fe; font-size: clamp(14px, 1.6vw, 18px); max-width: 640px; opacity: 0; animation: fadeIn 1s .9s forwards; }
  .stats { display: flex; gap: clamp(14px, 4vw, 54px); flex-wrap: wrap; justify-content: center; opacity: 0;
           animation: fadeIn 1s 1.3s forwards; }
  .stat { min-width: 120px; padding: 12px 18px; border-radius: 14px; background: rgba(255,255,255,.05);
          border: 1px solid rgba(125,211,252,.25); backdrop-filter: blur(6px); }
  .num { font-family: 'Orbitron', sans-serif; font-size: clamp(20px, 2.6vw, 30px);
         background: linear-gradient(90deg, #7dd3fc, #c084fc); -webkit-background-clip: text; color: transparent; }
  .lbl { color: #94a3b8; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
  .cue { color: #7dd3fc; font-size: 13px; letter-spacing: .2em; margin-top: 14px; animation: bounce 2s infinite; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes glow { 50% { text-shadow: 0 0 26px rgba(125,211,252,.9), 0 0 60px rgba(192,132,252,.6); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); opacity: .6; } 50% { transform: translateY(6px); opacity: 1; } }
</style>
</head>
<body>
<div id="scene"></div>
<div class="overlay">
  <div>
    <div class="eyebrow">NASA Exoplanet Archive · Machine Learning</div>
    <h1>FIND THE NEXT EARTH</h1>
    <div class="sub">Ranking every known planet beyond our solar system by how Earth-like it is.</div>
  </div>
  <div>
    <div class="stats">
      <div class="stat"><div class="num" data-to="__N_PLANETS__">0</div><div class="lbl">Planets analyzed</div></div>
      <div class="stat"><div class="num" data-to="4">0</div><div class="lbl">Planet types found</div></div>
      <div class="stat"><div class="num" data-to="__N_STRONG__">0</div><div class="lbl">Strong candidates</div></div>
      <div class="stat"><div class="num" data-to="__NEAREST__" data-dec="1">0</div><div class="lbl">Light-years to nearest</div></div>
    </div>
    <div class="cue">▼ SCROLL TO EXPLORE ▼</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Count-up stats ----------
document.querySelectorAll('.num').forEach(el => {
  const to = parseFloat(el.dataset.to), dec = el.dataset.dec ? 1 : 0, start = performance.now() + 1300, dur = 1800;
  (function tick(now) {
    const t = Math.min(Math.max((now - start) / dur, 0), 1), e = 1 - Math.pow(1 - t, 3);
    el.textContent = (to * e).toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec });
    if (t < 1) requestAnimationFrame(tick);
  })(performance.now());
});

// ---------- 3D scene ----------
const box = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
box.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
camera.position.set(0, 0.4, 9);

function resize() {
  const w = box.clientWidth, h = box.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  // Pull the camera back on narrow screens so the planet fits between the title and the stats.
  const aspect = w / h;
  camera.position.z = aspect < 1.3 ? Math.min(9 * 1.45 / aspect, 24) : 9;
}
window.addEventListener('resize', resize); resize();

// Starfield: two layers drifting at different speeds for depth.
function stars(n, rMin, rMax, size, color) {
  const g = new THREE.BufferGeometry(), pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = rMin + Math.random() * (rMax - rMin), th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos.set([r * Math.sin(ph) * Math.cos(th), r * Math.sin(ph) * Math.sin(th), r * Math.cos(ph)], i * 3);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ size, color, transparent: true, opacity: .9, sizeAttenuation: true });
  const p = new THREE.Points(g, m); scene.add(p); return p;
}
const starsFar = stars(4000, 200, 600, 1.4, 0xffffff);
const starsNear = stars(900, 40, 140, 0.6, 0x9ecbff);

// Procedural Earth-like planet: noise-based continents, oceans, clouds, ice caps.
const noiseGLSL = `
  float hash(vec3 p){ p = fract(p*0.3183099 + .1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
  float noise(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
    return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x), mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x), mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y), f.z); }
  float fbm(vec3 p){ float v = 0., a = .5; for (int i = 0; i < 6; i++){ v += a*noise(p); p *= 2.03; a *= .5; } return v; }`;
const planet = new THREE.Mesh(
  new THREE.SphereGeometry(2, 128, 128),
  new THREE.ShaderMaterial({
    uniforms: { t: { value: 0 } },
    vertexShader: `varying vec3 vN; varying vec3 vP;
      void main(){ vN = normalize(normalMatrix*normal); vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform float t; varying vec3 vN; varying vec3 vP; ${noiseGLSL}
      void main(){
        vec3 p = normalize(vP);
        float n = fbm(p*2.6);
        float c = fbm(p*3.5 + vec3(t*.03, 0., t*.01));
        vec3 ocean = mix(vec3(.01,.06,.22), vec3(.04,.28,.55), smoothstep(.3,.52,n));
        vec3 land  = mix(vec3(.10,.42,.18), vec3(.55,.47,.28), smoothstep(.56,.72,n));
        vec3 col = n > .52 ? land : ocean;
        col = mix(col, vec3(.96), smoothstep(.78,.92,abs(p.y)));          // ice caps
        col = mix(col, vec3(1.), smoothstep(.55,.78,c)*.75);               // clouds
        vec3 L = normalize(vec3(-1., .35, .7));
        float d = max(dot(vN, L), 0.);
        col *= .08 + 1.05*d;
        float night = smoothstep(.15, -.1, dot(vN, L)) * step(.52, n) * step(.6, fbm(p*14.));
        col += vec3(1., .75, .35) * night * .7;                             // city lights on the night side
        float rim = pow(1. - max(dot(vN, vec3(0,0,1)), 0.), 3.);
        col += vec3(.35,.65,1.) * rim * .9;
        gl_FragColor = vec4(col, 1.);
      }`
  })
);
planet.rotation.z = 0.41; // Earth's 23.4° axial tilt
scene.add(planet);

// Atmosphere glow.
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(2.45, 64, 64),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true,
    vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying vec3 vN; void main(){ float i = pow(.72 - dot(vN, vec3(0,0,1.)), 3.5); gl_FragColor = vec4(.35,.65,1.,1.)*i; }`
  })
));

// Glowing orbs on tilted orbits: one per planet type, in the dashboard's colors.
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(.2, 'rgba(255,255,255,.8)');
  grd.addColorStop(.5, 'rgba(255,255,255,.2)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
}
const tex = glowTexture();
const orbs = [
  { color: 0x4ade80, r: 3.2, speed: .45, tilt: .35, size: 1.1 },
  { color: 0xf87171, r: 2.7, speed: .8,  tilt: -.5, size: .8 },
  { color: 0xfb923c, r: 3.9, speed: .3,  tilt: .9,  size: 1.3 },
  { color: 0x60a5fa, r: 4.6, speed: .2,  tilt: -.2, size: 1.5 },
  { color: 0xc084fc, r: 3.6, speed: .55, tilt: 1.3, size: .9 },
  { color: 0xfacc15, r: 5.2, speed: .15, tilt: .6,  size: 1.0 },
].map((o, i) => {
  const pivot = new THREE.Group(); pivot.rotation.x = o.tilt; pivot.rotation.y = i; scene.add(pivot);
  const ring = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(Array.from({ length: 128 }, (_, k) =>
      new THREE.Vector3(Math.cos(k / 128 * Math.PI * 2) * o.r, 0, Math.sin(k / 128 * Math.PI * 2) * o.r))),
    new THREE.LineBasicMaterial({ color: o.color, transparent: true, opacity: .14 }));
  pivot.add(ring);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: o.color, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
  sprite.scale.set(o.size, o.size, 1);
  const core = new THREE.Mesh(new THREE.SphereGeometry(o.size * .12, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  const holder = new THREE.Group(); holder.add(sprite, core); pivot.add(holder);
  return { ...o, holder, phase: Math.random() * 6.28 };
});

// Mouse parallax.
let mx = 0, my = 0;
window.addEventListener('mousemove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });

const clock = new THREE.Clock();
(function animate() {
  const t = clock.getElapsedTime();
  planet.rotation.y = t * .08;
  planet.material.uniforms.t.value = t;
  orbs.forEach(o => {
    const a = o.phase + t * o.speed;
    o.holder.position.set(Math.cos(a) * o.r, 0, Math.sin(a) * o.r);
    const pulse = 1 + .15 * Math.sin(t * 2 + o.phase);
    o.holder.children[0].scale.set(o.size * pulse, o.size * pulse, 1);
  });
  starsFar.rotation.y = t * .004; starsNear.rotation.y = t * .012;
  starsNear.material.opacity = .6 + .3 * Math.sin(t * 1.7);
  camera.position.x += (mx * 2.2 - camera.position.x) * .04;
  camera.position.y += (-my * 1.4 + .4 - camera.position.y) * .04;
  camera.lookAt(0, -0.2, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
